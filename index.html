<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Happy Birthday, Komal</title>
  <meta name="description" content="A cinematic birthday surprise for Komal" />

  <!-- Display face for the big emotional moments + a clean body/UI face -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Marcellus&family=Manrope:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- App root. Only one .scene is ever visible at a time; script.js toggles
       the .active class and fades between them. -->
  <div id="app">

    <!-- ============================================================ -->
    <!-- SCENE 1 — WELCOME                                             -->
    <!-- ============================================================ -->
    <section id="scene-welcome" class="scene is-active" aria-label="Welcome">

      <!-- Slow drifting starfield + soft particles, drawn once and animated
           with requestAnimationFrame at a very low, cinematic speed. -->
      <canvas id="starfield-canvas" class="bg-canvas"></canvas>

      <!-- Soft moving gradient glow, pure CSS so it costs nothing on the
           main thread. -->
      <div class="ambient-glow ambient-glow--a"></div>
      <div class="ambient-glow ambient-glow--b"></div>

      <div class="welcome-content">
        <p class="eyebrow">a little secret for special one</p>
        <h1 class="welcome-name">Hello Princess<span class="ellipsis">...</span></h1>
        <p class="welcome-sub">Someone has a surprise for you<span class="ellipsis">...</span></p>
        <div class="welcome-heart" aria-hidden="true">❤️</div>

        <button id="begin-btn" class="begin-btn" type="button">
          <span class="begin-btn-ring"></span>
          <span class="begin-btn-label">Tap here To Begin</span>
        </button>
      </div>

      <!-- Shown instead of advancing, if tapped before the unlock date/time
           set in script.js. Fades in, then fades back out automatically. -->
      <div id="lock-message" class="lock-message" aria-live="polite">
        <div class="lock-emoji" aria-hidden="true">🎁</div>
        <p class="lock-text">
          Thoda sabar karo...<br />
          Yeh surprise <strong>18 August, 12:00 baje</strong> khulega ❤️
        </p>
      </div>
    </section>

    <!-- ============================================================ -->
    <!-- SCENE 2 — COUNTDOWN                                           -->
    <!-- ============================================================ -->
    <section id="scene-countdown" class="scene" aria-label="Countdown">
      <div class="countdown-stage">
        <div id="countdown-number" class="countdown-number"></div>
      </div>
      <!-- Full-screen flash used both per-beat and for the big finale flash -->
      <div id="flash-overlay" class="flash-overlay"></div>
    </section>

    <!-- ============================================================ -->
    <!-- SCENE 3 — GRAND REVEAL                                        -->
    <!-- ============================================================ -->
    <section id="scene-reveal" class="scene" aria-label="Happy Birthday Komal">

      <!-- Realistic physics-based fireworks -->
      <canvas id="fireworks-canvas" class="bg-canvas"></canvas>
      <!-- Falling confetti, separate canvas so it can be layered above fireworks -->
      <canvas id="confetti-canvas" class="bg-canvas"></canvas>

      <!-- Rotating light rays behind the headline -->
      <div class="light-rays" aria-hidden="true"></div>

      <!-- Rising balloons + twinkling sparkles are lightweight DOM nodes
           generated by script.js -->
      <div id="balloons-layer" class="balloons-layer" aria-hidden="true"></div>
      <div id="sparkles-layer" class="sparkles-layer" aria-hidden="true"></div>

      <div class="reveal-content">
        <div class="reveal-emoji" aria-hidden="true">🎉</div>
        <h1 class="reveal-title">
          <span class="reveal-line reveal-line--happy">Happy</span>
          <span class="reveal-line reveal-line--birthday">Birthday</span>
          <span class="reveal-line reveal-line--name">Komal</span>
        </h1>
        <div class="reveal-heart" aria-hidden="true">❤️</div>

        <button id="video-trigger-btn" class="video-trigger-btn" type="button">
          <span class="video-trigger-emoji" aria-hidden="true">🎁</span>
          <span class="video-trigger-label">Dabaiye na</span>
        </button>
      </div>
    </section>

  </div>

  <!-- Full-screen video surprise, opened by tapping "Dabaiye na" in Scene 3.
       Provide your own file named surprise-video.mp4 next to this page. -->
  <div id="video-modal" class="video-modal" aria-hidden="true">
    <button id="video-close-btn" class="video-close-btn" type="button" aria-label="Close video">✕</button>
    <div class="video-modal-inner">
      <video id="surprise-video" class="surprise-video" src="surprise-video.mp4" playsinline></video>
      <div id="video-end-caption" class="video-end-caption">
        <div class="video-end-emoji" aria-hidden="true">🎉</div>
        <p class="video-end-text">Badhaiyaan! 🎂</p>
      </div>
    </div>
  </div>

  <!-- Peaceful ambient music for the welcome screen, before Komal taps to
       begin. Provide your own file named peaceful.mp3 next to this page.
       It attempts to autoplay on load, and — since most mobile browsers
       block audio before any touch — also starts the instant the screen
       is first touched, fading out the moment "Begin" is tapped. -->
  <audio id="welcome-music" src="peaceful.mp3" preload="auto" loop></audio>

  <!-- Main background music, started once Komal taps "Begin". Provide
       your own file named music.mp3 next to this page. -->
  <audio id="bg-music" src="music.mp3" preload="auto" loop></audio>

  <script src="script.js"></script>
</body>
</html>
